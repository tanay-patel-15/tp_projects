<!doctype html>
<html>
  <body>
    <h1>Todo List</h1>
    <form method="POST" action="/add">
      <input name="task" placeholder="Enter task">
      <button type="submit">Add</button>
    </form>
    <ul>
      {% for todo in todos %}
        <li>{{ todo['task'] }} <a href="/delete/{{ todo['id'] }}">Delete</a></li>
      {% endfor %}
    </ul>
  </body>
</html>
